<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">RepoRelay coding context pack</title><desc id="desc">Illustrative output using the bundled synthetic checkout issue, with candidate files and evidence.</desc><rect width="1280" height="640" rx="24" fill="#0b1019"/><g font-family="Arial,sans-serif"><text x="70" y="76" fill="#82e4c4" font-size="20" letter-spacing="5">REPORELAY / ISSUE → CONTEXT</text><text x="70" y="145" fill="#f4f6fb" font-size="48" font-weight="bold">Less searching. More shipping.</text><text x="70" y="185" fill="#a6b3c8" font-size="21">An explainable starting point for your next fix.</text><rect x="70" y="230" width="1140" height="340" rx="16" fill="#141d2b" stroke="#2c3b50"/><text x="100" y="275" fill="#82e4c4" font-size="16">SYNTHETIC DEMO · example/checkout · ISSUE #42</text><text x="100" y="320" fill="#f4f6fb" font-size="27">Checkout retry creates duplicate payment</text><path d="M100 345H1180" stroke="#2c3b50"/><g font-size="20" fill="#edf2fa"><text x="100" y="391">01   src/payments/retry.ts</text><text x="100" y="449">02   src/payments/checkout.ts</text><text x="100" y="507">03   tests/payments/retry.test.ts</text></g><g font-size="17" fill="#a6b3c8"><text x="660" y="391">Exact path mentioned in issue</text><text x="660" y="449">Path matches “checkout”</text><text x="660" y="507">Related test path</text></g><text x="70" y="610" fill="#a6b3c8" font-size="17">GitHub REST API · Markdown + JSON · Node.js 22+ · MIT · No runtime dependencies</text></g></svg>
